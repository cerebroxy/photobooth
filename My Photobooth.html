<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>my photobooth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF6EF; --card:#FFFFFF; --ink:#3A2E32; --ink-soft:#7A6B70;
    --pink:#FF9EB5; --pink-soft:#FFE3EA;
    --lilac:#C9B8FF; --lilac-soft:#EAE3FF;
    --mint:#8FE3C8; --mint-soft:#DDFBF0;
    --butter:#FFD873; --butter-soft:#FFF3D6;
    --frame:#FFE3EA;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--cream); color:var(--ink);
    font-family:'Nunito',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100%; padding:28px 16px;
  }
  h1,h2{font-family:'Fredoka',system-ui,sans-serif; margin:0; font-weight:600;}
  .stage{width:100%; max-width:420px; display:flex; flex-direction:column; align-items:center; gap:18px;}
  .card{
    background:var(--card); border-radius:28px; padding:28px 24px;
    box-shadow:0 12px 32px rgba(255,158,181,0.18); width:100%;
    display:flex; flex-direction:column; align-items:center; gap:16px; text-align:center;
  }
  .eyebrow{color:var(--ink-soft); font-size:0.95rem;}
  h1{font-size:1.7rem;}
  .doodle{font-size:2.2rem;}
  button{
    font-family:'Fredoka',system-ui,sans-serif; font-size:1.02rem; font-weight:600;
    border:none; border-radius:999px; padding:13px 28px; cursor:pointer;
    background:var(--pink); color:#fff; transition:transform .12s ease, box-shadow .12s ease;
    box-shadow:0 6px 16px rgba(255,158,181,0.4);
  }
  button:hover{transform:translateY(-1px);}
  button:active{transform:translateY(0);}
  button.ghost{background:var(--pink-soft); color:var(--ink); box-shadow:none;}
  button:disabled{opacity:0.5; cursor:default; transform:none;}
  .video-wrap{position:relative; width:100%; aspect-ratio:4/3; border-radius:20px; overflow:hidden; background:#000;}
  video{width:100%; height:100%; object-fit:cover; transform:scaleX(-1);}
  .countdown{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Fredoka',sans-serif; font-size:5rem; color:#fff; text-shadow:0 4px 18px rgba(0,0,0,0.35);
    pointer-events:none;
  }
  .flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none;}
  .flash.on{animation:flashpop .35s ease-out;}
  @keyframes flashpop{0%{opacity:0.9;}100%{opacity:0;}}
  .shots{display:flex; gap:8px; justify-content:center;}
  .shot-dot{width:10px; height:10px; border-radius:50%; background:var(--pink-soft);}
  .shot-dot.filled{background:var(--pink);}
  .options{display:flex; flex-direction:column; gap:14px; width:100%;}
  .opt-group{text-align:left;}
  .opt-label{font-size:0.85rem; color:var(--ink-soft); font-weight:700; margin-bottom:8px; display:block;}
  .swatches{display:flex; gap:10px;}
  .swatch{
    width:38px; height:38px; border-radius:50%; cursor:pointer; border:3px solid transparent;
    display:flex; align-items:center; justify-content:center;
  }
  .swatch.selected{border-color:var(--ink);}
  .filters{display:flex; gap:8px; flex-wrap:wrap;}
  .filter-pill{
    padding:8px 14px; border-radius:999px; background:var(--pink-soft); font-size:0.88rem;
    cursor:pointer; font-weight:700; color:var(--ink);
  }
  .filter-pill.selected{background:var(--pink); color:#fff;}
  #strip-canvas{width:100%; max-width:280px; border-radius:14px; box-shadow:0 14px 30px rgba(0,0,0,0.15);}
  .result-actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
  .hint{font-size:0.85rem; color:var(--ink-soft);}
  .hidden{display:none !important;}
  @media (prefers-reduced-motion: reduce){ .flash.on{animation:none;} button{transition:none;} }
</style>
</head>
<body>
<div class="stage">

  <div class="card" id="screen-start">
    <div class="doodle">🩷📸</div>
    <span class="eyebrow">just for you</span>
    <h1>my little photobooth</h1>
    <p class="hint">Turn on your camera and take a strip of 4 photos, all to yourself.</p>
    <button id="btn-enable-camera">Turn on camera</button>
    <p class="hint" id="camera-error" style="color:#D96B6B; display:none;"></p>
  </div>

  <div class="card hidden" id="screen-setup">
    <h2>pick your vibe</h2>
    <div class="video-wrap">
      <video id="video" autoplay playsinline muted></video>
    </div>
    <div class="options">
      <div class="opt-group">
        <span class="opt-label">frame color</span>
        <div class="swatches" id="frame-swatches"></div>
      </div>
      <div class="opt-group">
        <span class="opt-label">filter</span>
        <div class="filters" id="filter-pills"></div>
      </div>
    </div>
    <button id="btn-start-strip">Start — 4 photos</button>
  </div>

  <div class="card hidden" id="screen-capture">
    <h2 id="capture-title">get ready!</h2>
    <div class="video-wrap">
      <video id="video-capture" autoplay playsinline muted></video>
      <div class="countdown" id="countdown"></div>
      <div class="flash" id="flash"></div>
    </div>
    <div class="shots" id="shot-dots"></div>
  </div>

  <div class="card hidden" id="screen-result">
    <h2>cute! 🎀</h2>
    <canvas id="strip-canvas"></canvas>
    <div class="result-actions">
      <button id="btn-download">Save photo strip</button>
      <button class="ghost" id="btn-retake">Retake</button>
    </div>
  </div>

</div>

<script>
const frameThemes = [
  {name:'Blush', bg:'#FFE3EA', accent:'#FF9EB5'},
  {name:'Lilac', bg:'#EAE3FF', accent:'#C9B8FF'},
  {name:'Mint', bg:'#DDFBF0', accent:'#8FE3C8'},
  {name:'Butter', bg:'#FFF3D6', accent:'#FFD873'},
];
const filterOptions = [
  {name:'Normal', css:'none'},
  {name:'Soft Glow', css:'brightness(1.08) contrast(0.95) saturate(1.15) blur(0.3px)'},
  {name:'B&W', css:'grayscale(1) contrast(1.05)'},
  {name:'Warm Film', css:'sepia(0.25) saturate(1.3) contrast(1.05) brightness(1.03)'},
];

let selectedFrame = 0;
let selectedFilter = 0;
let stream = null;
const shots = [];

const screens = {
  start: document.getElementById('screen-start'),
  setup: document.getElementById('screen-setup'),
  capture: document.getElementById('screen-capture'),
  result: document.getElementById('screen-result'),
};
function showScreen(name){
  Object.values(screens).forEach(s=>s.classList.add('hidden'));
  screens[name].classList.remove('hidden');
}

// build swatches
const swatchWrap = document.getElementById('frame-swatches');
frameThemes.forEach((f,i)=>{
  const el = document.createElement('div');
  el.className = 'swatch' + (i===0 ? ' selected':'');
  el.style.background = f.accent;
  el.title = f.name;
  el.addEventListener('click', ()=>{
    selectedFrame = i;
    [...swatchWrap.children].forEach(c=>c.classList.remove('selected'));
    el.classList.add('selected');
  });
  swatchWrap.appendChild(el);
});

const filterWrap = document.getElementById('filter-pills');
filterOptions.forEach((f,i)=>{
  const el = document.createElement('div');
  el.className = 'filter-pill' + (i===0 ? ' selected':'');
  el.textContent = f.name;
  el.addEventListener('click', ()=>{
    selectedFilter = i;
    [...filterWrap.children].forEach(c=>c.classList.remove('selected'));
    el.classList.add('selected');
    document.getElementById('video').style.filter = f.css;
  });
  filterWrap.appendChild(el);
});

document.getElementById('btn-enable-camera').addEventListener('click', async ()=>{
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{width:640,height:480}, audio:false});
    document.getElementById('video').srcObject = stream;
    document.getElementById('video-capture').srcObject = stream;
    showScreen('setup');
  }catch(err){
    const e = document.getElementById('camera-error');
    e.style.display = 'block';
    e.textContent = "Couldn't access your camera — check your browser's permission settings and try again.";
  }
});

document.getElementById('btn-start-strip').addEventListener('click', ()=>{
  shots.length = 0;
  buildDots();
  showScreen('capture');
  document.getElementById('video-capture').style.filter = filterOptions[selectedFilter].css;
  captureSequence();
});

function buildDots(){
  const wrap = document.getElementById('shot-dots');
  wrap.innerHTML = '';
  for(let i=0;i<4;i++){
    const d = document.createElement('div');
    d.className = 'shot-dot';
    wrap.appendChild(d);
  }
}
function fillDot(i){
  document.getElementById('shot-dots').children[i].classList.add('filled');
}

async function captureSequence(){
  const titleEl = document.getElementById('capture-title');
  const countdownEl = document.getElementById('countdown');
  const flashEl = document.getElementById('flash');
  const videoEl = document.getElementById('video-capture');

  for(let shotIndex=0; shotIndex<4; shotIndex++){
    titleEl.textContent = `photo ${shotIndex+1} of 4`;
    for(let n=3; n>=1; n--){
      countdownEl.textContent = n;
      await wait(700);
    }
    countdownEl.textContent = '';
    flashEl.classList.add('on');
    shots.push(grabFrame(videoEl));
    fillDot(shotIndex);
    await wait(500);
    flashEl.classList.remove('on');
    await wait(500);
  }
  titleEl.textContent = 'all done!';
  await wait(400);
  assembleStrip();
  showScreen('result');
}
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

function grabFrame(videoEl){
  const c = document.createElement('canvas');
  c.width = 480; c.height = 360;
  const ctx = c.getContext('2d');
  ctx.filter = filterOptions[selectedFilter].css;
  ctx.translate(c.width,0); ctx.scale(-1,1); // mirror to match preview
  ctx.drawImage(videoEl, 0, 0, c.width, c.height);
  return c;
}

function assembleStrip(){
  const theme = frameThemes[selectedFrame];
  const padding = 24, gap = 16, photoW = 480, photoH = 360;
  const captionH = 90;
  const cw = photoW + padding*2;
  const ch = padding*2 + photoH*4 + gap*3 + captionH;
  const canvas = document.getElementById('strip-canvas');
  canvas.width = cw; canvas.height = ch;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = theme.bg;
  roundRect(ctx,0,0,cw,ch,28); ctx.fill();

  shots.forEach((shotCanvas,i)=>{
    const y = padding + i*(photoH+gap);
    ctx.save();
    roundRect(ctx, padding, y, photoW, photoH, 14);
    ctx.clip();
    ctx.drawImage(shotCanvas, padding, y, photoW, photoH);
    ctx.restore();
  });

  ctx.fillStyle = theme.accent;
  ctx.font = "600 30px Fredoka, sans-serif";
  ctx.textAlign = 'center';
  const date = new Date();
  const dateStr = date.toLocaleDateString(undefined,{month:'short', day:'numeric', year:'numeric'});
  ctx.fillText('just me · ' + dateStr, cw/2, ch - captionH/2 + 10);
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

document.getElementById('btn-download').addEventListener('click', ()=>{
  const canvas = document.getElementById('strip-canvas');
  const link = document.createElement('a');
  link.download = 'my-photobooth-strip.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

document.getElementById('btn-retake').addEventListener('click', ()=>{
  showScreen('setup');
});
</script>
</body>
</html>
